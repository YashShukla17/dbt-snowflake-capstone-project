snowflake_dbt_json:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}" # Or hardcode your account ID like 'xy12345.us-east-1'
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      role: SYSADMIN # Or whatever role you use
      database: dbt_captsone
      warehouse: COMPUTE_WH
      schema: "{{ env_var('DBT_SCHEMA') }}"
